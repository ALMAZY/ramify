[package]
name = "ramify"
version = "0.1.0"
description = "Keyboard-first mind map for fast notes"
license = "MIT"
authors = ["Aleksandrs Mazurs"]
repository = "https://github.com/ALMAZY/ramify"
edition = "2021"

[lib]
name = "ramify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
trash = "5"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
