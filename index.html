<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramify</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sb-head">
          <button id="sb-folder" class="sb-folder" title="Choose folder"></button>
          <button id="sb-new" class="icon-btn" title="New map (⌘N)">＋</button>
        </div>
        <input id="sb-filter" class="sb-filter" placeholder="Filter maps…" spellcheck="false" />
        <ul id="sb-list"></ul>
        <div class="sb-foot">
          <button id="sb-help" class="link-btn">Shortcuts <kbd>?</kbd></button>
        </div>
      </aside>
      <main id="main">
        <header id="topbar">
          <nav id="crumbs"></nav>
          <div class="top-right">
            <span id="save-state"></span>
            <div class="seg" id="view-seg">
              <button data-view="map" title="Map (⌘1)">Map</button>
              <button data-view="outline" title="Outline (⌘2)">Outline</button>
            </div>
            <button id="palette-btn" class="icon-btn" title="Command palette (⌘K)">⌘K</button>
          </div>
        </header>
        <section id="stage">
          <div id="map-view" class="view">
            <div id="world">
              <svg id="edges"></svg>
              <div id="nodes"></div>
            </div>
            <div id="empty-hint" hidden></div>
          </div>
          <div id="outline-view" class="view" hidden></div>
        </section>
      </main>
      <aside id="notes" hidden>
        <div class="notes-head">
          <span id="notes-title"></span>
          <button id="notes-close" class="icon-btn" title="Close (Esc)">✕</button>
        </div>
        <textarea id="notes-text" placeholder="Markdown notes for this topic…" spellcheck="true"></textarea>
        <div class="notes-foot">Markdown · <kbd>Esc</kbd> back to map</div>
      </aside>
    </div>
    <div id="palette" hidden>
      <div class="pal-box">
        <input id="pal-input" spellcheck="false" autocomplete="off" />
        <ul id="pal-list"></ul>
      </div>
    </div>
    <div id="help" hidden></div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
